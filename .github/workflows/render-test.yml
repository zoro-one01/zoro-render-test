name: render-test

on:
  push:
    paths:
      - '.github/workflows/render-test.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render test video (ffmpeg, 1080x1920, 5 detik)
        run: |
          mkdir -p out
          ffmpeg -y -f lavfi -i testsrc2=size=1080x1920:rate=30:duration=5 -f lavfi -i sine=frequency=440:duration=5 -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GITHUB RENDER TEST':fontsize=64:fontcolor=white:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest out/test-1080x1920.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of default=noprint_wrappers=1 out/test-1080x1920.mp4
      - name: Upload hasil render
        uses: actions/upload-artifact@v4
        with:
          name: test-1080x1920
          path: out/test-1080x1920.mp4
          retention-days: 1
