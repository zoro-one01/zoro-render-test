<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Beat 3 — Usia</title>
    <script src="./gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; color: white; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: linear-gradient(180deg, #1e1033 0%, #4c1d95 60%, #1e1033 100%); }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
      #num { margin: 0; font-size: 140px; font-weight: 800; letter-spacing: 4px; color: #5eead4; text-align: center; }
      #sub { margin: 0; font-size: 42px; font-weight: 600; letter-spacing: 2px; color: #ffffff; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6">
      <div class="bg"></div>
      <section id="main-clip" class="clip" data-start="0" data-duration="6">
        <h1 id="num">25 JUTA</h1>
        <p id="sub">TAHUN &mdash; DANAU TERTUA DI DUNIA</p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#num", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 0.2);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
