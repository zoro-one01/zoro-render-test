<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Beat 1 — Hook</title>
    <script src="./gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; color: white; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: linear-gradient(180deg, #0b1026 0%, #0e3a5d 55%, #0b6e6e 100%); }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
      #num { margin: 0; font-size: 140px; font-weight: 800; letter-spacing: 4px; color: #ffd60a; text-align: center; }
      #sub { margin: 0; font-size: 42px; font-weight: 600; letter-spacing: 2px; color: #ffffff; text-align: center; }
      #pill { font-size: 36px; font-weight: 700; letter-spacing: 3px; color: #ffffff; border: 3px solid #ffd60a; border-radius: 999px; padding: 16px 40px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6">
      <div class="bg"></div>
      <section id="main-clip" class="clip" data-start="0" data-duration="6">
        <h1 id="num">1.642 M</h1>
        <p id="sub">DANAU TERDALAM DI DUNIA</p>
        <div id="pill">DANAU BAIKAL &bull; SIBERIA</div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#num", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.9);
      tl.fromTo("#pill", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 1.5);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
