<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Beat 2 — Panjang</title>
    <script src="./gsap.min.js"></script>
    <style>
      body { margin: 0; background: #0b0f14; color: white; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .bg { position: absolute; inset: 0; background: linear-gradient(180deg, #062a2a 0%, #0b6e6e 60%, #0e3a5d 100%); }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
      #num { margin: 0; font-size: 160px; font-weight: 800; letter-spacing: 6px; color: #ffffff; text-align: center; }
      #sub { margin: 0; font-size: 42px; font-weight: 600; letter-spacing: 2px; color: #ffd60a; text-align: center; }
      .track { width: 70%; height: 14px; background: rgba(255, 255, 255, 0.25); border-radius: 999px; overflow: hidden; }
      #bar { width: 100%; height: 100%; background: #ffd60a; border-radius: 999px; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="6">
      <div class="bg"></div>
      <section id="main-clip" class="clip" data-start="0" data-duration="6">
        <h1 id="num">636 KM</h1>
        <p id="sub">PANJANG DARI UJUNG KE UJUNG</p>
        <div class="track"><div id="bar"></div></div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#num", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.9);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 4.4, ease: "none" }, 1.4);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
