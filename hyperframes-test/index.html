<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>HyperFrames GitHub Render Test</title>
    <script src="./gsap.min.js"></script>
    <style>
      body {
        margin: 0;
        background: #0b0f14;
        color: white;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, #0b1026 0%, #0e3a5d 55%, #0b6e6e 100%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 36px;
      }
      #title {
        margin: 0;
        font-size: 148px;
        font-weight: 800;
        letter-spacing: 6px;
        color: #ffd60a;
        text-align: center;
      }
      #sub {
        margin: 0;
        font-size: 54px;
        font-weight: 600;
        letter-spacing: 12px;
        color: #ffffff;
        text-align: center;
      }
      #pill {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #ffffff;
        border: 3px solid #ffd60a;
        border-radius: 999px;
        padding: 18px 42px;
      }
      .chips {
        display: flex;
        gap: 20px;
      }
      .chip {
        font-size: 38px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #0b1026;
        background: #ffffff;
        border-radius: 16px;
        padding: 16px 30px;
      }
      .track {
        width: 70%;
        height: 14px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        overflow: hidden;
      }
      #bar {
        width: 100%;
        height: 100%;
        background: #ffd60a;
        border-radius: 999px;
        transform-origin: left center;
      }
      #foot {
        font-size: 28px;
        letter-spacing: 2px;
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="10"
    >
      <div class="bg"></div>
      <section id="main-clip" class="clip" data-start="0" data-duration="10">
        <h1 id="title">HYPERFRAMES</h1>
        <p id="sub">RENDER DI GITHUB</p>
        <div id="pill">10 DETIK &bull; 1080 &times; 1920</div>
        <div class="chips">
          <span class="chip">HTML</span>
          <span class="chip">FRAME</span>
          <span class="chip">MP4</span>
        </div>
        <div class="track"><div id="bar"></div></div>
        <p id="foot">github.com/zoro-one01/zoro-render-test</p>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#sub", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 0.9);
      tl.fromTo("#pill", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 1.5);
      tl.fromTo(".chip", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, stagger: 0.35, ease: "power3.out" }, 2.1);
      tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 3.5);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 9.4, ease: "none" }, 0.2);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
